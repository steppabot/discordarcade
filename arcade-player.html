<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token Player</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#15102e;color:#f4f1fc}*{box-sizing:border-box}html,body,#game{width:100%;height:100%;margin:0;overflow:hidden}#game{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}ruffle-player{display:block;width:100%;height:100%}#status{position:absolute;inset:0;display:grid;place-content:center;padding:24px;text-align:center;background:#15102e;z-index:5}#status[hidden]{display:none}#status p{max-width:480px;line-height:1.6;color:#bcb3ce;overflow-wrap:anywhere}#retry{justify-self:center;padding:10px 20px;border:0;border-radius:8px;background:#2ed7e9;color:#15102e;font:inherit;font-weight:700;cursor:pointer}#retry[hidden]{display:none}h1{font-size:22px;color:#ff45ad}canvas{touch-action:none}
</style></head><body><div id="game"></div><div id="status" role="status"><h1>Token Arcade</h1><p id="message">Loading player…</p><button id="retry" hidden>Try again</button></div>
<script>
const params=new URLSearchParams(location.search),container=document.getElementById('game'),statusBox=document.getElementById('status'),message=document.getElementById('message'),retry=document.getElementById('retry');
retry.onclick=()=>location.reload();container.addEventListener('contextmenu',e=>e.preventDefault());
function fileURL(value){if(!value)throw new Error('This game has no file URL.');const url=new URL(value,location.href);if(url.protocol!=='https:')throw new Error('Game files must use HTTPS.');return url.href;}
function loadScript(src){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error('The player could not download. Please try again.'));document.head.append(script);});}
async function access(){const response=await fetch('https://api.discordarcade.com/api/arcade/access',{credentials:'include',cache:'no-store',signal:AbortSignal.timeout(12000)});if(!response.ok)throw new Error('Could not verify premium access. Please try again.');const data=await response.json();if(data.allowed!==true)throw new Error('Premium access is required. Return to the arcade to sign in or choose a free game.');}
async function start(){const type=params.get('type'),url=fileURL(params.get('url')),title=params.get('title')||'Token Arcade';document.title=title;
if(type==='retro'){
 message.textContent='Checking premium access…';await access();message.textContent='Loading emulator…';
 const core=params.get('core');if(!core||!/^[a-z0-9_-]+$/i.test(core))throw new Error('The emulator core is missing or invalid.');
 window.EJS_player='#game';window.EJS_core=core;window.EJS_gameUrl=url;window.EJS_gameName=title;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_color='#2ed7e9';window.EJS_backgroundColor='#15102e';window.EJS_startOnLoaded=false;window.EJS_threads=false;window.EJS_defaultOptions={'save-state-location':'browser','save-state-slot':1};
 if(params.get('bios'))window.EJS_biosUrl=fileURL(params.get('bios'));
 await loadScript(window.EJS_pathtodata+'loader.js');statusBox.hidden=true;return;
}
if(type==='flash'){
 window.RufflePlayer=window.RufflePlayer||{};window.RufflePlayer.config={autoplay:'off',allowScriptAccess:false,backgroundColor:'#15102e'};
 await loadScript('https://unpkg.com/@ruffle-rs/ruffle');const player=window.RufflePlayer.newest().createPlayer();container.append(player);await player.ruffle().load({url,autoplay:'off',allowScriptAccess:false});statusBox.hidden=true;return;
}throw new Error('Unsupported game type.');}
start().catch(error=>{message.textContent=error.message||'Could not start this game.';retry.hidden=false;statusBox.hidden=false;});
</script></body></html>
