<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Token Player</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #15102e;
      color: #f4f1fc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #game {
      position: relative;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    ruffle-player {
      display: block;
      width: 100%;
      height: 100%;
    }

    canvas {
      touch-action: none;
    }

    /* Group host: a fixed 4:3 emulator under the shared view, so the
       stream has no letterboxing and every player's crop lines up. */
    #game.stream-source {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }

    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      text-align: center;
      background: #15102e;
      z-index: 5;
    }

    #status[hidden] {
      display: none;
    }

    #status h1 {
      font-size: 22px;
      color: #ff45ad;
    }

    #status p {
      max-width: 480px;
      line-height: 1.6;
      color: #bcb3ce;
      overflow-wrap: anywhere;
    }

    #retry {
      justify-self: center;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: #2ed7e9;
      color: #15102e;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #retry[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="status" role="status">
    <h1>Token Arcade</h1>
    <p id="message">Loading player…</p>
    <button id="retry" type="button" hidden>Try again</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    const container = document.getElementById("game");
    const statusBox = document.getElementById("status");
    const message = document.getElementById("message");
    const retry = document.getElementById("retry");

    retry.onclick = () => location.reload();

    container.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    // Validate game and BIOS URLs.
    function fileURL(value) {
      if (!value) {
        throw new Error("This game has no file URL.");
      }

      const url = new URL(value, location.href);

      if (url.protocol !== "https:") {
        throw new Error("Game files must use HTTPS.");
      }

      return url.href;
    }

    // Load an emulator script.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = src;
        script.onload = resolve;

        script.onerror = () => {
          reject(
            new Error(
              "The player could not download. Please try again."
            )
          );
        };

        document.head.append(script);
      });
    }

    // N64 (mupen64plus_next) settings. The core reads these once, at boot.
    // Bump the version whenever this list changes so saved values reset.
    const N64_PRESET_VERSION = "3";

    const N64_OPTIONS = {
      // Render near native resolution.
      "mupen64plus-43screensize": "320x240",
      "mupen64plus-MultiSampling": "0",
      "mupen64plus-FXAA": "0",

      // Skip the per-frame framebuffer readbacks. The default "Software"
      // depth copy re-renders every frame's depth buffer on the CPU.
      "mupen64plus-EnableCopyDepthToRDRAM": "Off",
      "mupen64plus-EnableCopyColorToRDRAM": "Off",

      // N64 CPU time per frame. "0" uses the core's built-in value for
      // each game; N64_GAME_OPTIONS below overrides it for specific games.
      "mupen64plus-CountPerOp": "0",

      // Pace the emulator by its audio instead of the display refresh.
      // With vsync on, a frame that runs slightly long waits for the next
      // refresh and costs a whole extra frame; off, it catches up.
      "vsync": "disabled",

      "shader": "disabled"
    };

    // Per-game N64 tuning, keyed by ROM file name. Games whose speed is
    // tied to frames rendered go into slow motion when starved of CPU time,
    // so only lower it where the game copes.
    const N64_GAME_OPTIONS = {
      // GoldenEye keeps real-time speed while dropping in-game frames, so
      // a slower N64 CPU (3) saves host work and keeps audio fed.
      "goldeneye007.z64": { "mupen64plus-CountPerOp": "3" },

      // Revenge slows down at 3 (20 of its 30 frames); 2 is full speed at
      // a lighter load than the core's own value (1).
      "wcwvsnworevenge.z64": { "mupen64plus-CountPerOp": "2" }
    };

    function n64Options(url) {
      const file = decodeURIComponent(new URL(url).pathname.split("/").pop() || "").toLowerCase();
      return { ...N64_OPTIONS, ...(N64_GAME_OPTIONS[file] || {}) };
    }

    // Audio buffer for N64, in ms (EmulatorJS uses 64). A bigger buffer
    // rides out short stalls, like a shader compiling, without a gap.
    const N64_AUDIO_LATENCY = 128;

    // EmulatorJS has no setting for the audio buffer, so adjust the
    // RetroArch config it generates as soon as its class is defined.
    function setAudioLatency(ms) {
      let GameManager;

      Object.defineProperty(window, "EJS_GameManager", {
        configurable: true,

        get() {
          return GameManager;
        },

        set(value) {
          GameManager = value;
          const original = value?.prototype?.getRetroArchCfg;

          if (typeof original !== "function") return;

          value.prototype.getRetroArchCfg = function() {
            return original.call(this).replace(
              /^audio_latency = \d+$/m,
              `audio_latency = ${ms}`
            );
          };
        }
      });
    }

    // EmulatorJS only writes EJS_defaultOptions into the core's boot config
    // when it already has saved settings for the game. On a first launch
    // the core boots on its own defaults (640x480, CPU depth copy) and our
    // options arrive after boot, too late to matter. Seed that record so
    // they apply at boot, and clear stale saved values once per version.
    function prepareBootOptions(system, title, options, version) {
      const key = `ejs-1-${system}-${title}-settings`;
      const presetKey = `token-arcade-preset:${key}`;

      try {
        let saved = null;

        try {
          saved = JSON.parse(localStorage.getItem(key));
        } catch {
          // Unreadable record: replace it below.
        }

        if (!saved || typeof saved !== "object") {
          saved = {};
        }

        if (!saved.settings || typeof saved.settings !== "object") {
          saved.settings = {};
        }

        if (localStorage.getItem(presetKey) !== version) {
          for (const name of Object.keys(options)) {
            delete saved.settings[name];
          }

          localStorage.setItem(presetKey, version);
        }

        localStorage.setItem(key, JSON.stringify(saved));
      } catch {
        // Storage blocked: the game still runs on the core's defaults.
      }
    }

    // Verify premium access before loading a retro game.
    async function access() {
      const response = await fetch(
        "https://api.discordarcade.com/api/arcade/access",
        {
          credentials: "include",
          cache: "no-store",
          signal: AbortSignal.timeout(12000)
        }
      );

      if (!response.ok) {
        throw new Error(
          "Could not verify premium access. Please try again."
        );
      }

      const data = await response.json();

      if (data.allowed !== true) {
        throw new Error(
          "Premium access is required. Return to the arcade " +
          "to sign in or choose a free game."
        );
      }
    }

    // Load EmulatorJS. A group host starts right away (the Start button
    // was the click) and renders at a fixed 4:3 size for streaming.
    async function bootRetro(core, url, title, group = {}) {
      window.EJS_player = "#game";
      window.EJS_core = core;
      window.EJS_gameUrl = url;
      window.EJS_gameName = title;

      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

      window.EJS_color = "#2ed7e9";
      window.EJS_backgroundColor = "#15102e";
      window.EJS_startOnLoaded = Boolean(group.host);
      window.EJS_threads = false;

      window.EJS_defaultOptions = {
        "save-state-location": "browser",
        "save-state-slot": 1
      };

      // N64: lighter rendering, applied at boot.
      if (core === "n64" || core === "mupen64plus_next") {
        const options = n64Options(url);
        Object.assign(window.EJS_defaultOptions, options);
        prepareBootOptions("n64", title, options, N64_PRESET_VERSION);
        setAudioLatency(N64_AUDIO_LATENCY);
      }

      const bios = params.get("bios");

      if (bios) {
        window.EJS_biosUrl = fileURL(bios);
      }

      if (group.host) {
        container.classList.add("stream-source");
        window.EJS_onGameStart = group.onStart;
      }

      await loadScript(
        window.EJS_pathtodata + "loader.js"
      );
    }

    async function start() {
      const type = params.get("type");
      const url = fileURL(params.get("url"));
      const title = params.get("title") || "Token Arcade";

      document.title = title;

      // Retro games: EmulatorJS.
      if (type === "retro") {
        message.textContent = "Checking premium access…";
        await access();

        const core = params.get("core");

        if (!core || !/^[a-z0-9_-]+$/i.test(core)) {
          throw new Error(
            "The emulator core is missing or invalid."
          );
        }

        // Multiplayer group: the lobby decides who runs the emulator.
        const group = params.get("group");

        if (group && /^[A-Za-z0-9_-]{8,24}$/.test(group)) {
          await loadScript("arcade-group.js");

          await window.TokenGroup.start({
            groupId: group,
            statusBox,
            message,
            game: { title },
            bootEmulator: ({ onStart }) =>
              bootRetro(core, url, title, { host: true, onStart })
          });
          return;
        }

        message.textContent = "Loading emulator…";
        await bootRetro(core, url, title);
        statusBox.hidden = true;
        return;
      }

      // Flash games: Ruffle.
      if (type === "flash") {
        window.RufflePlayer = window.RufflePlayer || {};

        window.RufflePlayer.config = {
          autoplay: "off",
          allowScriptAccess: false,
          backgroundColor: "#15102e"
        };

        await loadScript(
          "https://unpkg.com/@ruffle-rs/ruffle"
        );

        const player = window.RufflePlayer
          .newest()
          .createPlayer();

        container.append(player);

        await player.ruffle().load({
          url,
          autoplay: "off",
          allowScriptAccess: false
        });

        statusBox.hidden = true;
        return;
      }

      throw new Error("Unsupported game type.");
    }

    start().catch((error) => {
      message.textContent =
        error.message || "Could not start this game.";

      retry.hidden = false;
      statusBox.hidden = false;
    });
  </script>
</body>
</html>
