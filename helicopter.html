<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helicopter — Explosion Update</title>
<style>
  *{box-sizing:border-box}
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#202225;color:#edf0f4;font-family:system-ui,sans-serif}
  .game{width:min(1100px,100%);overflow:hidden;border:1px solid #151619;border-radius:12px;background:#070b09;box-shadow:0 20px 70px #0004}
  .top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:#2f3136}
  .heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .heading strong{font-size:13px;letter-spacing:1.5px}
  .badge{font-size:9px;color:#ffd391;background:#5b391f;border:1px solid #8e5c2d;padding:4px 7px;border-radius:4px}
  .stats{display:flex;gap:18px;font-size:10px;color:#b2b6bd;white-space:nowrap}
  .stats b{margin-left:6px;color:#b9f77d;font-size:14px;font-variant-numeric:tabular-nums}
  .stage{position:relative;aspect-ratio:16/9;outline:none}
  .stage:focus-visible{outline:2px solid #b9f77d;outline-offset:-3px}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;background:#030a0565;backdrop-filter:blur(1px)}
  [hidden]{display:none!important}
  .overlay small{color:#b9f77d;font-size:10px;letter-spacing:3px}
  h1{font-size:clamp(28px,7vw,65px);letter-spacing:3px;margin:12px 0}
  .overlay p{font-size:12px;color:#d3dfcf;line-height:1.7;margin:0 0 22px}
  button{font:inherit;cursor:pointer;border:1px solid #4b4f57;border-radius:7px;padding:9px 13px;color:#edf0f4;background:#202225}
  button:hover{background:#40444b}
  button:focus-visible{outline:2px solid #b9f77d;outline-offset:3px}
  .primary{background:#b9f77d;color:#172113;font-weight:750;border:0;padding:13px 28px}
  .primary:hover{background:#d1ffa2}
  .test{background:#53331d;border-color:#916038;color:#ffdaa5;font-weight:650;font-size:11px}
  .test:hover{background:#714826}
  .bottom{flex-wrap:wrap;font-size:11px;color:#aeb3bb}
  .actions{display:flex;align-items:center;gap:7px}
  kbd{font:10px system-ui;background:#202225;color:#e5e7eb;border:1px solid #535760;border-radius:4px;padding:3px 6px}
  .tip{font-size:11px;text-align:center;color:#aeb3bb;margin:14px 0 0}
  .wrap{width:min(1100px,100%)}
  .game:fullscreen{display:flex;flex-direction:column;justify-content:center}
  .game:fullscreen .stage{flex:1;min-height:0;aspect-ratio:auto}
  .game:fullscreen canvas{object-fit:contain}
  @media(max-width:560px){
    body{padding:8px}.top,.bottom{padding:11px}.stats{gap:8px}
    .stats b{font-size:12px}.badge{font-size:8px}.heading{gap:5px}
    .overlay p{font-size:10px;margin-bottom:14px}.overlay small{font-size:8px}
    .primary{padding:10px 22px}.bottom{font-size:10px}.actions{gap:5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="game" id="game">
    <div class="top">
      <div class="heading">
        <strong>HELICOPTER</strong>
        <span class="badge">EXPLOSION UPDATE</span>
      </div>
      <div class="stats">
        <span>DISTANCE <b id="score">0</b></span>
        <span>BEST <b id="best">0</b></span>
      </div>
    </div>
    <div class="stage" id="stage" tabindex="0" aria-label="Hold Space, Up Arrow, mouse, or touch to rise. Release to fall. P pauses.">
      <canvas id="canvas" width="960" height="540"></canvas>
      <div class="overlay" id="overlay">
        <small>WOLFPAC ARCADE</small>
        <h1 id="title">HELICOPTER</h1>
        <p id="description">Hold to rise. Release to fall.<br>Hit the green terrain to see the explosion.</p>
        <button class="primary" id="play">Play now →</button>
      </div>
    </div>
    <div class="bottom">
      <span><kbd>SPACE</kbd> / <kbd>HOLD / TOUCH</kbd> to rise · release to fall</span>
      <div class="actions">
        <button class="test" id="test">💥 Test explosion</button>
        <button id="pause" aria-label="Pause or resume" title="Pause or resume">Ⅱ</button>
        <button id="sound" aria-label="Toggle sound" aria-pressed="false" title="Toggle sound">♪</button>
        <button id="fullscreen" aria-label="Fullscreen" title="Fullscreen">⛶</button>
      </div>
    </div>
  </main>
  <p class="tip">Click “Test explosion” to preview the fireball, sparks, debris, and smoke instantly.</p>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  const W = 960, H = 540, TAU = Math.PI * 2;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let state = 'ready', held = false, travel = 0, distance = 0, best = 0;
  let heli = {x:180,y:260,vy:0}, obstacles = [], trail = [], explosion = null;
  let nextObstacle = 1050, accumulator = 0, last = performance.now();
  let sound = false, audioContext = null;
  try { best = Number(localStorage.getItem('arcade-helicopter-best')) || 0; } catch {}
  $('best').textContent = best;

  function terrain(x) {
    const squeeze = Math.min(distance / 160, 30);
    return {
      top: Math.round((59 + Math.sin(x / 250) * 17 + Math.sin(x / 83) * 6 + squeeze) / 6) * 6,
      bottom: Math.round((465 + Math.sin(x / 290 + 1.3) * 22 + Math.sin(x / 105) * 9 - squeeze) / 6) * 6
    };
  }

  function setState(next) {
    state = next;
    $('overlay').hidden = next === 'playing' || next === 'exploding';
    $('pause').textContent = next === 'paused' ? '▷' : 'Ⅱ';
    if (next === 'paused') {
      $('title').textContent = 'PAUSED';
      $('description').textContent = 'Your flight is waiting right here.';
      $('play').textContent = 'Resume →';
    }
    if (next === 'over') {
      $('title').textContent = 'FLIGHT OVER';
      $('description').textContent = distance + ' meters. Best: ' + best + ' meters.';
      $('play').textContent = 'Fly again →';
    }
  }

  function start() {
    heli = {x:180,y:260,vy:0};
    travel = 0; distance = 0; nextObstacle = 1050;
    obstacles = []; trail = []; explosion = null;
    accumulator = 0; held = false;
    $('score').textContent = 0;
    setState('playing');
  }

  function pause() {
    held = false;
    if (state === 'playing') setState('paused');
  }

  function togglePause() {
    if (state === 'paused') { accumulator = 0; setState('playing'); }
    else pause();
  }

  function boomSound() {
    if (!sound) return;
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      audioContext.resume();
      const a = audioContext, duration = .55;
      const buffer = a.createBuffer(1, Math.floor(a.sampleRate * duration), a.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0; i<data.length; i++) {
        const fade = 1-i/data.length;
        data[i] = (Math.random()*2-1)*fade*fade;
      }
      const source = a.createBufferSource(), filter = a.createBiquadFilter(), gain = a.createGain();
      source.buffer = buffer;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1500,a.currentTime);
      filter.frequency.exponentialRampToValueAtTime(130,a.currentTime+duration);
      gain.gain.value = .24;
      source.connect(filter); filter.connect(gain); gain.connect(a.destination); source.start();
      const bass = a.createOscillator(), bassGain = a.createGain();
      bass.frequency.setValueAtTime(100,a.currentTime);
      bass.frequency.exponentialRampToValueAtTime(30,a.currentTime+.25);
      bassGain.gain.setValueAtTime(.12,a.currentTime);
      bassGain.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);
      bass.connect(bassGain); bassGain.connect(a.destination);
      bass.start(); bass.stop(a.currentTime+.32);
    } catch {}
  }

  function crash() {
    if (state !== 'playing') return;
    held = false; accumulator = 0;
    const particles = [];
    for (const [kind,count] of [['fire',19],['spark',36],['debris',13],['smoke',16]]) {
      for (let i=0; i<count; i++) {
        const angle = Math.random()*TAU;
        const speed = kind==='spark' ? 150+Math.random()*360
          : kind==='debris' ? 100+Math.random()*220 : 35+Math.random()*115;
        particles.push({
          kind, x:(Math.random()-.5)*16, y:(Math.random()-.5)*12,
          vx:Math.cos(angle)*speed,
          vy:Math.sin(angle)*speed-(kind==='smoke'?55:0),
          life:kind==='fire' ? .35+Math.random()*.3
            : kind==='smoke' ? 1.05+Math.random()*.5 : .65+Math.random()*.6,
          size:kind==='fire' ? 10+Math.random()*15
            : kind==='smoke' ? 13+Math.random()*17
            : kind==='debris' ? 3+Math.random()*6 : 1+Math.random()*2,
          spin:(Math.random()-.5)*20, angle, shade:Math.random()
        });
      }
    }
    explosion = {x:heli.x,y:heli.y,age:0,duration:1.6,particles};
    best = Math.max(best,distance);
    $('best').textContent = best;
    try { localStorage.setItem('arcade-helicopter-best',String(best)); } catch {}
    setState('exploding');
    boomSound();
  }

  function step(dt) {
    heli.vy = Math.max(-265,Math.min(285,heli.vy+(held?-600:440)*dt));
    heli.y += heli.vy*dt;
    travel += (185+Math.min(distance/12,100))*dt;
    distance = Math.floor(travel/10);
    $('score').textContent = distance;

    while (nextObstacle < travel+W+50) {
      const t = terrain(nextObstacle), h = 90+Math.random()*36, k = Math.random();
      obstacles.push({
        x:nextObstacle,w:35,h,
        y:k<.4?t.top:k<.8?t.bottom-h:t.top+90+Math.random()*70
      });
      nextObstacle += 370+Math.random()*145;
    }
    obstacles = obstacles.filter(o=>o.x+o.w>travel-80);
    const t = terrain(heli.x+travel);
    if (heli.y-13<t.top || heli.y+13>t.bottom) { crash(); return; }

    for (const o of obstacles) {
      const x = o.x-travel;
      const dx = heli.x-Math.max(x,Math.min(heli.x,x+o.w));
      const dy = heli.y-Math.max(o.y,Math.min(heli.y,o.y+o.h));
      if (dx*dx+dy*dy<17*17) { crash(); return; }
    }
  }

  function updateExplosion(dt) {
    explosion.age += dt;
    for (const p of explosion.particles) {
      const drag = Math.exp(-(p.kind==='smoke'?1.3:2.2)*dt);
      p.vx *= drag; p.vy *= drag;
      p.vy += (p.kind==='debris'?350:p.kind==='spark'?150:p.kind==='smoke'?-45:-20)*dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.angle += p.spin*dt;
    }
    if (explosion.age >= explosion.duration) setState('over');
  }

  function circle(x,y,r,color) {
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);ctx.fill();
  }

  function drawExplosion() {
    const e=explosion,t=e.age;
    ctx.save();ctx.translate(e.x,e.y);

    for (const p of e.particles) {
      if (p.kind!=='smoke'||t>=p.life) continue;
      const q=t/p.life;
      ctx.globalAlpha=Math.min(1,t*9)*(1-q)*.65;
      circle(p.x,p.y,p.size*(.45+q*1.8),p.shade>.5?'#737572':'#3f4543');
    }
    ctx.globalAlpha=1;

    if (t<.65) {
      const fade=1-t/.65,radius=45+t*150;
      const glow=ctx.createRadialGradient(0,0,0,0,0,radius);
      glow.addColorStop(0,`rgba(255,245,170,${fade*.9})`);
      glow.addColorStop(.35,`rgba(255,125,25,${fade*.8})`);
      glow.addColorStop(1,'rgba(255,60,0,0)');
      ctx.fillStyle=glow;
      ctx.fillRect(-radius,-radius,radius*2,radius*2);
    }

    for (const p of e.particles) {
      if(p.kind==='smoke'||t>=p.life)continue;
      const q=t/p.life;
      ctx.save();ctx.translate(p.x,p.y);
      ctx.globalAlpha=Math.min(1,(1-q)*2);
      if(p.kind==='debris') {
        ctx.rotate(p.angle);
        ctx.fillStyle=p.shade>.5?'#d9edf7':'#639dbd';
        ctx.fillRect(-p.size,-p.size/3,p.size*2,p.size*.7);
      } else if(p.kind==='spark') {
        ctx.strokeStyle=p.shade>.5?'#fff5b5':'#ffad42';
        ctx.lineWidth=p.size*(1-q*.6);ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(0,0);
        ctx.lineTo(-p.vx*.04,-p.vy*.04);ctx.stroke();
      } else {
        const r=p.size*(.6+Math.sin(q*Math.PI)*.9);
        circle(0,0,r,q<.3?'#fff4bb':q<.65?'#ffb634':'#ef6220');
      }
      ctx.restore();
    }

    if(t<.4) {
      ctx.globalAlpha=(1-t/.4)*.8;
      ctx.strokeStyle='#ffd58b';ctx.lineWidth=3*(1-t/.4)+.5;
      ctx.beginPath();ctx.arc(0,0,10+t*250,0,TAU);ctx.stroke();
    }
    if(t<.15) {
      ctx.globalAlpha=1-t/.15;
      circle(0,0,26+t*90,'#fff9dc');
    }
    ctx.restore();
  }

  function drawHelicopter(time) {
    ctx.save();
    ctx.translate(heli.x,heli.y);
    ctx.rotate(Math.max(-.14,Math.min(.19,heli.vy/1400)));
    ctx.fillStyle='#7fa3bc';
    ctx.beginPath();ctx.moveTo(-19,0);ctx.lineTo(-43,-7);
    ctx.lineTo(-45,5);ctx.lineTo(-18,7);ctx.fill();
    ctx.fillStyle='#cce5f2';
    ctx.beginPath();ctx.ellipse(0,3,28,13,0,0,TAU);ctx.fill();
    ctx.fillStyle='#5ab4d9';
    ctx.beginPath();ctx.ellipse(13,-1,11,9,-.2,-1.5,1.5);ctx.fill();
    ctx.strokeStyle='#7595b2';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-9,-4);ctx.lineTo(-9,12);
    ctx.moveTo(3,-6);ctx.lineTo(3,13);ctx.stroke();
    ctx.strokeStyle='#a4b8c4';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-13,14);ctx.lineTo(-15,20);
    ctx.lineTo(20,20);ctx.lineTo(24,17);
    ctx.moveTo(8,14);ctx.lineTo(10,20);
    ctx.moveTo(-2,-10);ctx.lineTo(-2,-20);ctx.stroke();
    const rotor=state==='playing'?Math.sin(time*75):.75;
    ctx.strokeStyle='#70a7cf';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-39*rotor,-20);ctx.lineTo(39*rotor,-20);ctx.stroke();
    ctx.restore();
  }

  function draw(time) {
    ctx.fillStyle='#070b09';ctx.fillRect(0,0,W,H);
    ctx.save();
    if(state==='exploding'&&!reducedMotion) {
      const force=8*Math.pow(Math.max(0,1-explosion.age/.32),2);
      ctx.translate(Math.sin(time*173)*force,Math.cos(time*139)*force);
    }

    ctx.strokeStyle='#0c1b10';ctx.lineWidth=1;
    for(let x=-(travel*.25)%60;x<W;x+=60) {
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=0;y<H;y+=60) {
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }

    ctx.fillStyle='#67f466';
    for(let x=0;x<W;x+=8) {
      const t=terrain(x+travel);
      ctx.fillRect(x,0,9,t.top);ctx.fillRect(x,t.bottom,9,H-t.bottom);
    }
    for(const o of obstacles)ctx.fillRect(Math.round(o.x-travel),o.y,o.w,o.h);

    ctx.fillStyle='rgba(0,20,0,.20)';
    for(let x=0;x<W;x+=8) {
      const t=terrain(x+travel);
      for(let y=5;y<t.top;y+=8)ctx.fillRect(x,y,8,1);
      for(let y=Math.ceil(t.bottom/8)*8;y<H;y+=8)ctx.fillRect(x,y,8,1);
    }
    for(const o of obstacles) {
      for(let y=o.y+5;y<o.y+o.h;y+=8)ctx.fillRect(o.x-travel,y,o.w,1);
    }

    for(const p of trail)circle(p.x,p.y,3+(1-p.life)*4,`rgba(165,184,175,${p.life*.45})`);
    if(state!=='exploding'&&state!=='over')drawHelicopter(time);
    if(explosion)drawExplosion();

    ctx.fillStyle='rgba(2,5,3,.10)';
    for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
    ctx.restore();
  }

  function frame(now) {
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(state==='playing') {
      accumulator+=dt;
      while(accumulator>=1/120) {
        accumulator-=1/120;step(1/120);
        if(state!=='playing')break;
      }
      if(state==='playing'&&Math.random()<.8)trail.push({x:heli.x-29,y:heli.y+4,life:1});
    } else if(state==='exploding')updateExplosion(dt);

    if(state==='playing'||state==='exploding') {
      for(const p of trail){p.x-=dt*190;p.life-=dt*.85;p.y+=dt*9;}
      trail=trail.filter(p=>p.life>0);
    }
    draw(now/1000);
    requestAnimationFrame(frame);
  }

  $('play').onclick=()=>{
    if(state==='paused'){accumulator=0;setState('playing');}
    else start();
    $('stage').focus({preventScroll:true});
  };
  $('test').onclick=()=>{
    start();
    heli.x=W/2;heli.y=H/2;
    crash();
    $('stage').focus({preventScroll:true});
  };
  $('pause').onclick=togglePause;
  $('sound').onclick=()=>{
    sound=!sound;
    $('sound').setAttribute('aria-pressed',String(sound));
    $('sound').style.color=sound?'#b9f77d':'';
  };
  $('fullscreen').onclick=async()=>{
    try {
      if(document.fullscreenElement)await document.exitFullscreen();
      else await $('game').requestFullscreen?.();
    } catch {}
  };

  $('stage').addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||state!=='playing')return;
    held=true;$('stage').focus({preventScroll:true});
    $('stage').setPointerCapture(e.pointerId);e.preventDefault();
  });
  for(const event of ['pointerup','pointercancel','lostpointercapture'])
    $('stage').addEventListener(event,()=>held=false);

  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea,button,a,[contenteditable]'))return;
    if(e.code==='Space'||e.code==='ArrowUp') {
      e.preventDefault();
      if(!e.repeat) {
        if(state==='ready'||state==='over')start();
        else if(state==='paused'){accumulator=0;setState('playing');}
      }
      held=state==='playing';
    }
    if(e.code==='KeyP'&&!e.repeat)togglePause();
  });
  document.addEventListener('keyup',e=>{
    if(e.code==='Space'||e.code==='ArrowUp')held=false;
  });
  window.addEventListener('blur',pause);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
